<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="./favicon.svg?v=2" type="image/svg+xml" />
    <link rel="icon" href="./favicon.png?v=2" type="image/png" sizes="32x32" />
    <link rel="shortcut icon" href="./favicon.png?v=2" />
    <title>山海经 · 异兽图鉴</title>
    <meta
      name="description"
      content="《山海经》异兽形象画廊：已出图与待出图图鉴，典籍出处与短简介。"
    />
    <meta name="theme-color" content="#0a0b0e" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="hero">
        <div>
          <h1>山海经 · 异兽图鉴</h1>
          <p class="subtitle">电影 CG 气质画廊 · 典籍可核对文案 · 陆续上图</p>
        </div>
        <div class="stats" aria-live="polite">
          <span>已出图 <strong id="stat-ready">0</strong></span>
          <span>总数 <strong id="stat-total">0</strong></span>
          <span>当前显示 <strong id="stat-shown">0</strong></span>
        </div>
      </header>

      <section class="filters" aria-label="筛选">
        <label>
          篇目
          <select id="filter-volume">
            <option value="">全部篇目</option>
          </select>
        </label>
        <label>
          优先级
          <select id="filter-priority">
            <option value="">全部</option>
            <option value="高">高</option>
            <option value="中">中</option>
            <option value="低">低</option>
          </select>
        </label>
        <label>
          搜索
          <input id="filter-search" type="search" placeholder="名称 / 出处…" autocomplete="off" />
        </label>
        <label class="check">
          <input id="filter-ready" type="checkbox" />
          仅已出图
        </label>
      </section>

      <main id="grid" class="grid" aria-label="异兽列表"></main>

      <footer class="footer">
        <span>文案以《山海经》可核对记述为准；外形颜色等经文未写者属项目艺术设定。</span>
        <span
          ><a href="https://github.com/mattamior/shanhaijing-gallery">GitHub</a> ·
          <a href="https://mattamior.github.io/holo-card/all-in-one/#lv=5&amp;focus=yinglong"
            >应龙闪卡预览</a
          ></span
        >
      </footer>
    </div>

    <div id="modal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modal-name">
      <div id="modal-backdrop" class="modal__backdrop" tabindex="-1"></div>
      <div class="modal__panel">
        <button id="modal-close" class="modal__close" type="button" aria-label="关闭">×</button>
        <div id="modal-art" class="modal__art"></div>
        <div class="modal__info">
          <h2 id="modal-name"></h2>
          <p id="modal-source" class="modal__source"></p>
          <p id="modal-blurb" class="modal__blurb"></p>
          <div id="modal-tags" class="modal__tags"></div>
          <div class="modal__actions">
            <a
              id="modal-holo"
              class="btn btn-primary"
              hidden
              target="_blank"
              rel="noopener noreferrer"
              >打开闪卡预览</a
            >
            <button class="btn" type="button" onclick="document.getElementById('modal-close').click()">
              关闭
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="app.js" defer></script>
  </body>
</html>
